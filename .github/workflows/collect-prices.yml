# Legt den Preisverlauf an, den keine der genutzten APIs anbietet.
#
# weav3r liefert den aktuellen Marktpreis, Torn ebenfalls - aber niemand sagt,
# was ein Item ueblicherweise kostet. Genau das entscheidet aber, ob ein
# Angebot ein Fund ist: 20% unter Marktpreis kann beim einen Item ein
# Schnaeppchen und beim anderen der Normalzustand sein.
#
# Stuendlich statt alle zehn Minuten: Preise bewegen sich langsamer als
# Auslandsvorraete, und jeder Commit hier loest ein Pages-Deployment aus.

name: Preise sammeln

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preise lesen und Normalbereich neu rechnen
        run: node tools/collect-prices.mjs --dir data

      - name: Änderung festhalten
        run: |
          if git diff --quiet -- data/; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices data/price-stats.json
          git commit -m "Preise: Messpunkt vom $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Der Vorratssammler schreibt in dieselbe Ablage; zwischen Lesen und
          # Schreiben kann er committet haben.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "Konnte nicht pushen." >&2
          exit 1

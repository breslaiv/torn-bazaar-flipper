name: Deploy to GitHub Pages

# Nur noch von Hand. Das Repository ist privat, und GitHub Pages gibt es aus
# einem privaten Repository im Free-Tier nicht - bei jedem Push wuerde dieser
# Lauf fehlschlagen und Rauschen erzeugen. Ausserdem ist Pages nicht mehr das
# Ziel: die Fassung laeuft lokal, das Telefon kommt ueber Tailscale herein.
#
# Der Workflow bleibt stehen, weil die Entscheidung umkehrbar sein soll. Wer
# Pages wieder will - oder ein Konto hat, das private Repos dort erlaubt -,
# nimmt die zwei Zeilen unter `push` wieder herein.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein laufendes Deployment nicht abbrechen, aber nur eines gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Die Seite ist reines statisches HTML/CSS/ES-Modules ohne Build-Schritt,
      # das Repository-Root ist also schon das Artefakt.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
